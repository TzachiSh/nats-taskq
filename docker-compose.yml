services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15

  producer:
    build: .
    command: ["node", "src/producer.js"]
    environment:
      - NATS_URL=nats://nats:4222
      - TASK_COUNT=${TASK_COUNT:-1000}
    depends_on:
      nats:
        condition: service_healthy

  worker:
    build: .
    command: ["node", "src/worker.js"]
    environment:
      - NATS_URL=nats://nats:4222
      - FAIL_RATE=${FAIL_RATE:-0.1}
      - PROCESS_MS=${PROCESS_MS:-500}
      - MAX_INFLIGHT=${MAX_INFLIGHT:-5}
    depends_on:
      nats:
        condition: service_healthy
    deploy:
      replicas: 3

  verify:
    build: .
    command: ["node", "src/verify.js"]
    environment:
      - NATS_URL=nats://nats:4222
      - TASK_COUNT=${TASK_COUNT:-1000}
      - VERIFY_TIMEOUT_MS=${VERIFY_TIMEOUT_MS:-120000}
    depends_on:
      nats:
        condition: service_healthy
    profiles: ["verify"]

volumes:
  nats-data:
